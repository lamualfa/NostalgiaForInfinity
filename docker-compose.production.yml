---
services:
  freqtrade:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.production
    image: freqtrade_with_numba
    restart: unless-stopped
    environment:
      - FREQTRADE__BOT_NAME=${FREQTRADE__BOT_NAME}
      - FREQTRADE__TRADING_MODE=${FREQTRADE__TRADING_MODE}
      - FREQTRADE__MARGIN_MODE=${FREQTRADE__MARGIN_MODE}
      - FREQTRADE__EXCHANGE__NAME=${FREQTRADE__EXCHANGE__NAME}
      - FREQTRADE__EXCHANGE__KEY=${FREQTRADE__EXCHANGE__KEY}
      - FREQTRADE__EXCHANGE__SECRET=${FREQTRADE__EXCHANGE__SECRET}
      - FREQTRADE__API_SERVER__ENABLED=${FREQTRADE__API_SERVER__ENABLED}
      - FREQTRADE__API_SERVER__USERNAME=${FREQTRADE__API_SERVER__USERNAME}
      - FREQTRADE__API_SERVER__PASSWORD=${FREQTRADE__API_SERVER__PASSWORD}
      - FREQTRADE__API_SERVER__JWT_SECRET_KEY=${FREQTRADE__API_SERVER__JWT_SECRET_KEY}
      - FREQTRADE__API_SERVER__WS_TOKEN=${FREQTRADE__API_SERVER__WS_TOKEN}
      - FREQTRADE__DRY_RUN=${FREQTRADE__DRY_RUN}
      - FREQTRADE__STRATEGY=${FREQTRADE__STRATEGY}
    volumes:
      - freqtrade_user_data:/freqtrade/user_data
      - "./configs:/freqtrade/configs"
      - "./${FREQTRADE__STRATEGY:-NostalgiaForInfinityX7}.py:/freqtrade/${FREQTRADE__STRATEGY:-NostalgiaForInfinityX7}.py"
      - "./config.production.json:/freqtrade/config.production.json"
    command: >
      trade
      --config /freqtrade/config.production.json
      --db-url sqlite:////freqtrade/user_data/${FREQTRADE__BOT_NAME:-Example_Test_Account}_${FREQTRADE__EXCHANGE__NAME:-binance}_${FREQTRADE__TRADING_MODE:-futures}-tradesv3.sqlite
      --log-file user_data/logs/${FREQTRADE__BOT_NAME:-Example_Test_Account}-${FREQTRADE__EXCHANGE__NAME:-binance}-${FREQTRADE__STRATEGY:-NostalgiaForInfinityX7}-${FREQTRADE__TRADING_MODE:-futures}.log
      --strategy-path .
      -v

volumes:
  freqtrade_user_data:
